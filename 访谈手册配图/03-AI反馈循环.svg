<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><title>AI学习反馈循环</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52687A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><polygon points="62.0,170.0 330.0,170.0 308.0,280.0 40.0,280.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><path d="M450.0,185.0 C450.0,165.0 740.0,165.0 740.0,185.0 V265.0 C740.0,285.0 450.0,285.0 450.0,265.0 Z" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><path d="M450.0,185.0 C450.0,205.0 740.0,205.0 740.0,185.0" fill="none" stroke="#82b366" stroke-width="1.5"/><rect x="860.0" y="170.0" width="290.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="860.0" y="460.0" width="290.0" height="110.0" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><rect x="450.0" y="460.0" width="290.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="40.0" y="460.0" width="290.0" height="110.0" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><rect x="450.0" y="710.0" width="290.0" height="90.0" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><polyline points="330.0,225.0 450.0,225.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="740.0,225.0 860.0,225.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="1005.0,280.0 1005.0,460.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="860.0,515.0 740.0,515.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="450.0,515.0 330.0,515.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="185.0,460.0 185.0,280.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="450.0,755.0 185.0,755.0 185.0,570.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><text x="40.0" y="54.8" text-anchor="start" font-size="28" font-weight="700" fill="#172B3A">图 3｜把 AI 变成学习反馈循环的一部分</text><text x="40.0" y="110.6" text-anchor="start" font-size="16" font-weight="400" fill="#172B3A">本手册设计的学习流程。AI 提供整理与分析；事实核对、选择和责任由学习者承担。</text><text x="185.0" y="217.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">记录事实</text><text x="185.0" y="245.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">投入、任务、错误与结果</text><text x="595.0" y="217.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">保存材料</text><text x="595.0" y="245.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Markdown / 文件 / 原始记录</text><text x="1005.0" y="217.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">AI 整理与分析</text><text x="1005.0" y="245.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">发现模式；提出多个解释</text><text x="1005.0" y="507.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">人核对并选择</text><text x="1005.0" y="535.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">查原始证据；设预测与边界</text><text x="595.0" y="507.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">执行小规模试验</text><text x="595.0" y="535.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">完成练习、作品或服务</text><text x="185.0" y="507.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">比较预测与实际结果</text><text x="185.0" y="535.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">保留、修改或放弃方法</text><text x="595.0" y="747.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">外部反馈</text><text x="595.0" y="775.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">真实练习结果 / 实际使用者</text><rect x="119.0" y="357.0" width="132" height="26" rx="4" fill="#FFFFFF"/><text x="185.0" y="375.0" text-anchor="middle" font-size="16" fill="#41576A">新结果进入记录</text><rect x="275.5" y="742.0" width="84" height="26" rx="4" fill="#FFFFFF"/><text x="317.5" y="760.0" text-anchor="middle" font-size="16" fill="#41576A">检验解释</text></g></svg>