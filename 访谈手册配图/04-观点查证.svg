<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140"><title>观点查证与行动</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52687A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect x="410.0" y="160.0" width="380.0" height="90.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><polygon points="600.0,370.0 750.0,440.0 600.0,510.0 450.0,440.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><rect x="30.0" y="380.0" width="280.0" height="120.0" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><polygon points="600.0,640.0 750.0,710.0 600.0,780.0 450.0,710.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><rect x="890.0" y="650.0" width="280.0" height="120.0" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><rect x="410.0" y="930.0" width="380.0" height="90.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><polyline points="600.0,250.0 600.0,370.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="450.0,440.0 310.0,440.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="600.0,510.0 600.0,640.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="750.0,710.0 890.0,710.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="600.0,780.0 600.0,930.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><text x="40.0" y="54.8" text-anchor="start" font-size="28" font-weight="700" fill="#172B3A">图 4｜听到一个观点后，怎样查证并决定行动</text><text x="40.0" y="110.6" text-anchor="start" font-size="16" font-weight="400" fill="#172B3A">先区分证据与自述，再判断适用条件；暂不判断也是一种合格的学习结果。</text><text x="600.0" y="197.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">把观点改写为具体命题</text><text x="600.0" y="225.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">明确任务、对象和预期结果</text><text x="600.0" y="432.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">有足够可靠</text><text x="600.0" y="460.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">的证据吗？</text><text x="170.0" y="432.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">记录为未确认</text><text x="170.0" y="460.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">寻找原始资料；保持问题开放</text><text x="600.0" y="702.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">适合我的条件</text><text x="600.0" y="730.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">与责任吗？</text><text x="1030.0" y="702.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">不照搬</text><text x="1030.0" y="730.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">调整范围或继续观察</text><text x="600.0" y="967.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">设计可退出的小试验</text><text x="600.0" y="995.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">设时间、成本、预测与验收标准</text><text x="40.0" y="1096.3" text-anchor="start" font-size="18" font-weight="400" fill="#172B3A">完成试验后：用真实结果更新判断，再回到图 3 的反馈循环。</text><rect x="362.0" y="427.0" width="36" height="26" rx="4" fill="#FFFFFF"/><text x="380.0" y="445.0" text-anchor="middle" font-size="16" fill="#41576A">否</text><rect x="582.0" y="562.0" width="36" height="26" rx="4" fill="#FFFFFF"/><text x="600.0" y="580.0" text-anchor="middle" font-size="16" fill="#41576A">是</text><rect x="802.0" y="697.0" width="36" height="26" rx="4" fill="#FFFFFF"/><text x="820.0" y="715.0" text-anchor="middle" font-size="16" fill="#41576A">否</text><rect x="582.0" y="842.0" width="36" height="26" rx="4" fill="#FFFFFF"/><text x="600.0" y="860.0" text-anchor="middle" font-size="16" fill="#41576A">是</text></g></svg>