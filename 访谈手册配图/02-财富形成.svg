<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870"><title>财富形成机制</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52687A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect x="30.0" y="170.0" width="240.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="30.0" y="390.0" width="240.0" height="110.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><rect x="330.0" y="170.0" width="240.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="330.0" y="390.0" width="240.0" height="110.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><rect x="630.0" y="170.0" width="240.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="630.0" y="390.0" width="240.0" height="110.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><rect x="930.0" y="170.0" width="240.0" height="110.0" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><rect x="930.0" y="390.0" width="240.0" height="110.0" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><rect x="330.0" y="650.0" width="540.0" height="90.0" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><polyline points="150.0,280.0 150.0,390.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="450.0,280.0 450.0,390.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="750.0,280.0 750.0,390.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="1050.0,280.0 1050.0,390.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="150.0,500.0 150.0,570.0 438.0,570.0 438.0,650.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="450.0,500.0 450.0,570.0 546.0,570.0 546.0,650.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="750.0,500.0 750.0,570.0 654.0,570.0 654.0,650.0" fill="none" stroke="#52687A" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline points="1050.0,500.0 1050.0,570.0 762.0,570.0 762.0,650.0" fill="none" stroke="#52687A" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="40.0" y="54.8" text-anchor="start" font-size="28" font-weight="700" fill="#172B3A">图 2｜财富是怎样累积的：四条路径与四个边界</text><text x="40.0" y="110.6" text-anchor="start" font-size="16" font-weight="400" fill="#172B3A">这是对商业与资产机制的解释，不是个人财富的审计表，也不代表每条路径都持续盈利。</text><text x="150.0" y="217.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">较早进入市场</text><text x="150.0" y="245.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">持有加密资产</text><text x="150.0" y="437.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">市场价格变化</text><text x="150.0" y="465.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">产生资产升值或损失</text><text x="450.0" y="217.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">创立项目</text><text x="450.0" y="245.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">关联主体持有代币</text><text x="450.0" y="437.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">项目发展与市场预期</text><text x="450.0" y="465.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">影响代币估值</text><text x="750.0" y="217.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">投资 / 收购业务</text><text x="750.0" y="245.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">持有企业权益</text><text x="750.0" y="437.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">经营收益与企业估值</text><text x="750.0" y="465.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">影响权益价值</text><text x="1050.0" y="217.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">营销与合作</text><text x="1050.0" y="245.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">扩大触达</text><text x="1050.0" y="437.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">用户 / 合作 / 资金机会</text><text x="1050.0" y="465.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">是否转化仍需验证</text><text x="600.0" y="687.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">个人净资产估计</text><text x="600.0" y="715.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">资产价值减去负债；具体归属和估值存在不确定性</text><text x="40.0" y="807.4" text-anchor="start" font-size="19" font-weight="400" fill="#172B3A">募集资金 ≠ 个人利润    ｜    账面价值 ≠ 可兑现现金</text><text x="40.0" y="835.9" text-anchor="start" font-size="19" font-weight="400" fill="#172B3A">网络费用 ≠ 创始人收入    ｜    客户资产 ≠ 老板财富</text></g></svg>