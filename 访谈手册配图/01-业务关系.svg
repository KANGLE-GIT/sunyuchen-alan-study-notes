h="1.8"  marker-end="url(#arrow)"/><polyline points="760.0,750.0 1040.0,750.0 1035.0,750.0 1035.0,520.0" fill="none" stroke="#52687A" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="40.0" y="54.8" text-anchor="start" font-size="28" font-weight="700" fill="#172B3A">图 1｜波场、稳定币与交易平台的业务关系</text><text x="40.0" y="110.6" text-anchor="start" font-size="16" font-weight="400" fill="#172B3A">实线表示功能或使用关系；虚线表示公开报道中的关联。此图不是持股或资金归属证明。</text><text x="165.0" y="212.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">Tether</text><text x="165.0" y="240.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">USDT 的发行方</text><text x="615.0" y="212.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">USDT</text><text x="615.0" y="240.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">可在不同链上流转的稳定币</text><text x="1035.0" y="212.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">用户与应用</text><text x="1035.0" y="240.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">转账、支付与链上操作</text><text x="615.0" y="457.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">TRON / 波场网络</text><text x="615.0" y="485.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">承载转账和智能合约</text><text x="165.0" y="457.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">TRX 原生代币</text><text x="165.0" y="485.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">资源、质押与治理</text><text x="1035.0" y="443.15" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">交易平台</text><text x="1035.0" y="471.65" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">HTX、Poloniex 等</text><text x="1035.0" y="500.15" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">交易与资产出入口</text><text x="615.0" y="742.4" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">孙宇晨</text><text x="615.0" y="770.9" text-anchor="middle" font-size="19" font-weight="400" fill="#172B3A">波场创始人；关联业务参与者</text><text x="40.0" y="855.95" text-anchor="start" font-size="17" font-weight="400" fill="#172B3A">边界：链上的 USDT ≠ 孙宇晨的资产；交易平台保管的客户资金 ≠ 经营者财产。</text><rect x="359.0" y="207.0" width="52" height="26" rx="4" fill="#FFFFFF"/><text x="385.0" y="225.0" text-anchor="middle" font-size="16" fill="#41576A">发行</text><rect x="804.0" y="207.0" width="52" height="26" rx="4" fill="#FFFFFF"/><text x="830.0" y="225.0" text-anchor="middle" font-size="16" fill="#41576A">使用</text><rect x="541.0" y="327.0" width="148" height="26" rx="4" fill="#FFFFFF"/><text x="615.0" y="345.0" text-anchor="middle" font-size="16" fill="#41576A">其中一种运行网络</text><rect x="319.0" y="452.0" width="132" height="26" rx="4" fill="#FFFFFF"/><text x="385.0" y="470.0" text-anchor="middle" font-size="16" fill="#41576A">参与资源与治理</text><rect x="969.0" y="327.0" width="132" height="26" rx="4" fill="#FFFFFF"/><text x="1035.0" y="345.0" text-anchor="middle" font-size="16" fill="#41576A">交易 / 提现</text><rect x="796.0" y="452.0" width="68" height="26" rx="4" fill="#FFFFFF"/><text x="830.0" y="470.0" text-anchor="middle" font-size="16" fill="#41576A">出入金</text><rect x="531.0" y="597.0" width="52" height="26" rx="4" fill="#FFFFFF"/><text x="557.0" y="615.0" text-anchor="middle" font-size="16" fill="#41576A">创立</text><rect x="818.0" y="737.0" width="164" height="26" rx="4" fill="#FFFFFF"/><text x="900.0" y="755.0" text-anchor="middle" font-size="16" fill="#41576A">投资 / 业务关联</text></g></svg>